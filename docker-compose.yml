version: "3.7"
services:
  scout:
    image: "scout:development"
    build:
      context: .context
    ports:
      - "3000"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    environment:
      REACT_APP_API_HOST: ${REACT_APP_API_HOST:http://localhost:3001/api/v1}
      REACT_APP_FILTERS_DATASOURCE: ${REACT_APP_FILTERS_DATASOURCE:http://localhost:3000/api/v1}
